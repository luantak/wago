name: Windows ARM64 completion diagnosis

on:
  push:
    branches: [codex/diagnose-windows-arm64-completion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-probes:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
      - name: Compile the unchanged native completion helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp/completion-helper | Out-Null
          go test -c -o .tmp/completion-helper/wago.exe ./cli/manager/internal/config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare startup, native helper, and real completion adapter
        shell: pwsh
        run: go run ./cli/manager/cmd/completion-shell-probe -helper .tmp/completion-helper/wago.exe -count 10
      - name: Run the unchanged package tests
        if: always()
        shell: pwsh
        run: go test -v -count=10 ./cli/manager/internal/config
      - name: Run unchanged checked completion tests
        if: always()
        shell: pwsh
        run: go test -v -count=10 -tags=wago_regalloccheck -run 'Completion' ./cli/manager/internal/config
